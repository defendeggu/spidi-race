services:
  spidi-race:
    build: .
    image: spidi-race:latest
    container_name: spidi-race
    restart: unless-stopped
    ports:
      - "${SPIDI_PORT:-8090}:8090"
    volumes:
      # permanente Rangliste: data/leaderboard.json (git-ignoriert, Vorlage im Repo)
      - ./data:/app/data
    # Härtung: nur ./data ist beschreibbar, keine Linux-Capabilities, keine Rechteausweitung
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 512m
