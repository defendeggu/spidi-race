name: Windows-App

# Builds the Windows installer (Electron) for every version tag and attaches it to the GitHub Release.
# Can also be started by hand (Actions → Windows-App → Run workflow): the installer is then only
# available as a build artifact of that run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Spiel bauen und testen
        run: |
          npm ci
          npm test
          npm run build -w client

      - name: Version aus dem Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Installer bauen
        working-directory: desktop
        run: |
          npm ci
          npm run typecheck
          npm run dist

      - uses: actions/upload-artifact@v7
        with:
          name: Spidi-Race-Windows
          path: desktop/release/*.exe
          if-no-files-found: error

      - name: Installer an das GitHub-Release hängen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          # release notes: the section of this version from the CHANGELOG
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Spidi Race $version" --notes-file notes.md
          gh release upload "$tag" desktop/release/*.exe --clobber
